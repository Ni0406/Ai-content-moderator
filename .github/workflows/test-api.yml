name: API Tests

on:
  push:
    branches: [ "main", "master", "seria_homework_2" ]
  pull_request:
    branches: [ "main", "master", "seria_homework_2" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn pytest httpx transformers torch
        
    - name: Run pytest
      run: |
        pytest test_api.py